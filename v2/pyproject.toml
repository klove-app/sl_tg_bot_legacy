[project]
name = "runtracker-bot-v2"
version = "2.0.0"
description = "Telegram group bot for tracking runs and per-chat leaderboards"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
